services:
  app:
    image: ${IMAGE_NAME:?Set IMAGE_NAME to the GHCR image}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the server .env}
      APP_URL: ${APP_URL:?Set APP_URL in the server .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - sqlite-data:/data
      - app-storage:/var/www/html/storage/app

volumes:
  sqlite-data:
  app-storage:
