name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Laravel tests
        run: php artisan test --compact

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  build-and-deploy:
    name: Build image and deploy production
    needs: ci
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE_NAME="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          if [ -z "$PRODUCTION_SSH_KEY" ] || [ -z "$PRODUCTION_KNOWN_HOSTS" ]; then
            echo "Set PRODUCTION_SSH_KEY and PRODUCTION_KNOWN_HOSTS repository secrets." >&2
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy image to production server
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$PRODUCTION_HOST" ] || [ -z "$PRODUCTION_USER" ]; then
            echo "Set PRODUCTION_HOST and PRODUCTION_USER repository secrets." >&2
            exit 1
          fi

          ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "test -d /opt/little-survey && test -w /opt/little-survey"
          scp -o BatchMode=yes docker-compose.production.yml \
            "$PRODUCTION_USER@$PRODUCTION_HOST:/opt/little-survey/docker-compose.yml"
          ssh -o BatchMode=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "cd /opt/little-survey && IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG docker compose pull && IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG docker compose up -d --no-build --remove-orphans"
